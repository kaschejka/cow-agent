<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Еноты-агенты — быстрая карточная игра по мотивам «6 берёт!»: партии на 2–4 игрока онлайн, рейтинг place-Elo, зал славы и чат с антиматом.">
<title>Еноты-агенты — карточная игра</title>
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="stylesheet" href="css/style.css?v=20260827zk">
</head>
<body>
<div id="app">
  <header id="topbar">
    <h1>🦝 Еноты-агенты</h1>
    <div id="status-bar">
      <span id="round-info"></span>
      <span id="turn-info"></span>
    </div>
    <button id="exit-btn" class="btn secondary hidden">⌂ В меню</button>
  </header>

  <section id="menu-screen" class="hidden">
    <div class="menu-top">
      <div class="menu-actions">
        <button id="solo-btn" class="btn primary">🤖 Одиночная игра</button>
        <button id="net-btn" class="btn primary">🌐 Сетевая игра</button>
        <button id="tops-btn" class="btn secondary">🏆 Топы</button>
        <button id="tut-btn" class="btn secondary">📖 Обучение</button>
      </div>
    </div>
    <div id="net-panel" class="menu-rooms hidden">
      <p class="net-label">Сколько игроков в вашей комнате?</p>
      <div class="count-row">
        <button class="btn count-btn" data-max="2">2</button>
        <button class="btn count-btn" data-max="3">3</button>
        <button class="btn count-btn" data-max="4">4</button>
      </div>
    </div>
    <div id="mp-error" class="mp-error"></div>
    <div id="auth-block" class="menu-rooms">
      <div id="auth-info" class="auth-row">Загрузка...</div>
      <div id="auth-guest-actions" class="auth-providers"></div>
      <form id="auth-form" class="hidden" autocomplete="off">
        <label class="menu-name" id="auth-name-row">Имя в игре
          <input id="auth-name" maxlength="16">
        </label>
        <label class="menu-name">Логин
          <input id="auth-login" maxlength="32">
        </label>
        <label class="menu-name" id="auth-email-row">E-mail (подтверждение)
          <input id="auth-email" type="email" maxlength="191">
        </label>
        <label class="menu-name">Пароль
          <input id="auth-pass" type="password" maxlength="64">
        </label>
        <div class="lobby-actions">
          <button type="button" id="auth-submit" class="btn primary">Войти</button>
        </div>
        <p id="auth-error" class="mp-error"></p>
      </form>
    </div>
    <div class="menu-rooms">
      <h2>Комнаты в ожидании игроков</h2>
      <div id="mp-rooms"><p class="subtitle" style="text-align:center">Загрузка...</p></div>
    </div>
  </section>

  <main id="layout">
    <section id="game-col">
      <section id="table-wrap">
        <div id="played-strip"></div>
        <div id="banner" class="hidden">⚠️ Ваша карта меньше всех крайних — выберите ряд, который заберёте себе!</div>
        <div id="rows"></div>
      </section>

      <section id="hand-area">
<div id="hand-header">
<h2>Ваша рука</h2>
<span id="turn-timer" class="turn-timer" hidden></span>
<button id="play-btn" class="btn primary hidden" disabled>Сыграть карту</button>
        </div>
        <div id="hand"></div>
      </section>
    </section>

    <aside id="sidebar">
      <h2>Игроки</h2>
      <div id="players"></div>
      <div id="chat-box">
        <h2>Чат</h2>
        <div id="chat-log"></div>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" type="text" maxlength="200" placeholder="Сообщение…">
          <button class="btn chat-send" type="submit">➤</button>
        </form>
      </div>
    </aside>
  </main>
</div>

<div id="overlay" class="hidden">
  <div id="overlay-content" class="panel"></div>
</div>

<script src="js/mp.js?v=20260827zk"></script>
<script src="js/game.js?v=20260827zk"></script>
<script src="js/tutorial.js?v=20260827zk"></script>
<script src="js/auth.js?v=20260827zk"></script>
</body>
</html>
